# =============================================================================
# Real-Time Audio-to-Subtitles Configuration
# =============================================================================
# Priority: CLI > Environment Variables > Config File > Defaults
# See docs/ARCHITECTURE.md for complete reference
# =============================================================================

# -----------------------------------------------------------------------------
# Audio Settings
# -----------------------------------------------------------------------------
# device = -1                     # -1 = default device, or device index

# -----------------------------------------------------------------------------
# Speech-to-Text (Whisper)
# -----------------------------------------------------------------------------
# model = models/ggml-base.bin    # Whisper model file
# language = en                   # Language code (en, es, fr, de, zh, ja, etc.)
# n_threads = 4                   # CPU threads for inference
# use_gpu = true                  # Enable GPU acceleration
# flash_attn = true               # Enable Flash Attention

# -----------------------------------------------------------------------------
# Voice Activity Detection (Silero VAD)
# -----------------------------------------------------------------------------
# vad_model = models/silero_vad.onnx
# vad_threshold = 0.5             # Speech probability threshold (0.0-1.0)
# vad_energy_threshold = 0.001    # RMS energy gate threshold
# vad_smoothing = 0.3             # EMA smoothing (0.1=stable, 0.5=responsive)
# vad_hangover = 20               # Frames to extend after speech ends
# vad_preroll = 6                 # Frames to include before speech trigger
# vad_adaptive = true             # Enable adaptive threshold adjustment

# -----------------------------------------------------------------------------
# Streaming Transcription
# -----------------------------------------------------------------------------
# stt_step = 2000                 # Transcribe every N ms of new audio
# stt_keep = 500                  # Audio context to keep between windows
# stt_max_length = 10000          # Maximum sliding window size
# stt_dedup = true                # Enable token deduplication

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
# log_level = info                # trace, debug, info, warn, error
# log_file = logs/realtime-subtitler.log
# verbose = false
